name: Aktualizacja danych o ruchu

on:
  schedule:
    # --- Zakres doby ---------------------------------------------------------
    # Pomiary tylko w godzinach 04:00-17:59 UTC. Noc jest pominieta swiadomie:
    # miedzy 20:00 a 6:00 czasu lokalnego nie ma na tych drogach zatorow, ktore
    # warto pokazywac, a kazde zapytanie kosztuje limit.
    #
    # --- Dlaczego minuty nie sa okragle --------------------------------------
    # Dokumentacja GitHuba (sekcja "schedule" w events-that-trigger-workflows):
    #   "The schedule event can be delayed during periods of high loads of
    #    GitHub Actions workflow runs. High load times include the start of
    #    every hour. If the load is sufficiently high enough, some queued jobs
    #    may be dropped. To decrease the chance of delay, schedule your
    #    workflow to run at a different time of the hour."
    # Dlatego minuty omijaja zero i wielokrotnosci dziesieciu.
    #
    # SPROSTOWANIE wczesniejszej diagnozy: brak przebiegow w pierwszych
    # godzinach zycia repozytorium zostal wtedy przypisany wlasnie minutom
    # zerowym, ale nie zostalo to udowodnione. Rownie dobrze tlumaczy go fakt,
    # ze GitHub rejestruje harmonogram asynchronicznie po KAZDEJ zmianie tego
    # pliku (od kilkunastu minut do ponad godziny) i nie uruchamia zadan
    # wstecz - a plik byl wtedy edytowany kilkakrotnie. Nieokragle minuty
    # zostaja, bo sa zgodne z zaleceniem dokumentacji, ale nie sa lekiem na
    # brak uruchomien.
    #
    # --- Budzet TomTom -------------------------------------------------------
    # Darmowy prog Routing API to 20 000 zapytan MIESIECZNIE.
    # Kazdy przebieg zuzywa 8 zapytan (po jednym na trase).
    #
    # Szczyt, co 10 min: 04:00-07:59 i 12:00-15:59 UTC.
    #   Lato (UTC+2): 06:00-09:59 i 14:00-17:59 czasu lokalnego.
    #   Zima (UTC+1): 05:00-08:59 i 13:00-16:59.
    - cron: "4,14,24,34,44,54 4-7,12-15 * * *"
    # Poza szczytem, co 30 min: 08:00-11:59 i 16:00-17:59 UTC.
    #   Lato: 10:00-13:59 i 18:00-19:59 czasu lokalnego.
    #   Zima: 09:00-12:59 i 17:00-18:59.
    - cron: "12,42 8-11,16-17 * * *"
    #
    # Szczyt: 8 godzin x 6 = 48 przebiegow. Poza szczytem: 6 godzin x 2 = 12.
    # Razem 60 przebiegow/dobe x 8 tras = 480 zapytan/dobe.
    # W najdluzszym miesiacu: 480 x 31 = 14 880, czyli 80% budzetu 18 500.
    # Zapas to jeszcze 14 dodatkowych przebiegow na dobe.
    # Skrypt niezaleznie pilnuje budzetu i przerywa pomiary po 18 500 zapytaniach.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aktualizacja-ruchu
  cancel-in-progress: false

jobs:
  pomiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz czasy przejazdu
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/fetch_traffic.py

      - name: Przelicz profil godzinowy
        run: python scripts/build_profile.py

      # Zabezpieczenie przed sytuacja, w ktorej uzytkownik dostaje nowy HTML ze
      # starym CSS lub JS z pamieci podrecznej przegladarki. Skrypt jest
      # idempotentny - gdy zasoby sie nie zmienily, nie rusza pliku.
      - name: Odswiez wersje zasobow w index.html
        run: python scripts/wersjonuj_zasoby.py

      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "dane: pomiar ruchu $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
