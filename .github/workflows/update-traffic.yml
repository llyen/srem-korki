name: Aktualizacja danych o ruchu

on:
  schedule:
    # co 10 minut w godzinach 04:00-21:59 UTC (06:00-23:59 czasu polskiego latem)
    - cron: "*/10 4-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aktualizacja-ruchu
  cancel-in-progress: false

jobs:
  pomiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz czasy przejazdu
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/fetch_traffic.py

      - name: Przelicz profil godzinowy
        run: python scripts/build_profile.py

      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "dane: pomiar ruchu $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
