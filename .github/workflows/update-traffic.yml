name: Aktualizacja danych o ruchu

on:
  # --- Dlaczego nie ma tu bloku "schedule" ---------------------------------
  # Workflow mial wlasny harmonogram, ale GitHub nie uruchomil go ANI RAZU:
  # 0 przebiegow z harmonogramu przy 39 uruchomieniach recznych, wszystkich
  # zakonczonych powodzeniem. Sprawdzone i wykluczone jako przyczyna: galaz
  # domyslna (main), struktura pliku (parser YAML), uprawnienia Actions
  # (enabled, allowed_actions: all), stan workflow (active), rodzaj
  # repozytorium (publiczne, nie fork). Przyczyna pozostaje nieznana.
  #
  # Pomiary wyzwala teraz zegar w cron-job.org (scripts/konfiguruj_zegar.py),
  # ktory wola Cloudflare Workera z katalogu worker/, a ten wywoluje
  # workflow_dispatch przez API GitHuba - czyli ten sam kanal, ktory dziala
  # bezawaryjnie.
  #
  # Blok "schedule" zostal usuniety CELOWO. Gdyby harmonogram GitHuba kiedys
  # ozyl rownolegle z zegarem, pomiary wykonywalyby sie podwojnie: 960
  # zapytan dziennie zamiast 480, czyli wyczerpanie miesiecznego limitu TomTom
  # okolo 19 dnia miesiaca. To nie jest obawa teoretyczna - dokladnie tak
  # stalo sie 2 wrzesnia 2026, gdy crony Cloudflare ozyly po kilkunastu
  # godzinach milczenia i zaczely dublowac zegar zewnetrzny.
  #
  # Gdyby kiedys wrocic do harmonogramu GitHuba, wystarczy przywrocic:
  #   schedule:
  #     - cron: "4,14,24,34,44,54 4-7,12-15 * * *"   # szczyt, co 10 min
  #     - cron: "12,32,52 8-11,16-17 * * *"          # poza szczytem, co 20 min
  # ...i wylaczyc zadania w cron-job.org, zeby nie dublowaly pomiarow.
  # Uwaga: crony GitHuba znaja tylko UTC, wiec zimą siatka przesunie sie
  # o godzine - zegar zewnetrzny pracuje w strefie Europe/Warsaw.
  #
  # Minuty omijaja zero i wielokrotnosci dziesieciu zgodnie z zaleceniem
  # dokumentacji GitHuba (sekcja "schedule" w events-that-trigger-workflows):
  #   "The schedule event can be delayed during periods of high loads of
  #    GitHub Actions workflow runs. High load times include the start of
  #    every hour."
  # SPROSTOWANIE: brak uruchomien zostal kiedys przypisany wlasnie okraglym
  # minutom, ale nigdy tego nie udowodniono. Nieokragle minuty zostaly, bo sa
  # zgodne z zaleceniem, ale nie byly lekiem na brak przebiegow.
  #
  # --- Budzet TomTom -------------------------------------------------------
  # Darmowy prog Routing API to 20 000 zapytan MIESIECZNIE.
  # Kazdy przebieg zuzywa 8 zapytan (po jednym na trase).
  # 66 przebiegow/dobe x 8 = 528 zapytan/dobe; 528 x 31 = 16 368 (88,5% progu
  # roboczego 18 500). Przelicza to skrypt scripts/policz_budzet.py.
  # Skrypt pomiarowy niezaleznie pilnuje budzetu i przerywa po 18 500 zapytaniach.
  workflow_dispatch:

permissions:
  contents: write

# Serializuje przebiegi - dwa pomiary nie beda zapisywac danych jednoczesnie.
# cancel-in-progress: false, bo trwajacy pomiar jest juz oplacony zapytaniami
# do TomTom; anulowanie zmarnowaloby limit i nie zapisalo danych.
#
# UWAGA - to nie chroni przed podwojnym WYZWOLENIEM. Sprawdzone 2 wrzesnia
# 2026, gdy crony Cloudflare ozyly i dublowaly zegar zewnetrzny: kolejka
# zadzialala (przebiegi 05:44:13-22 i 05:44:25-33, bez nakladania), a drugi
# przebieg i tak konczyl sie bledem. Powod: actions/checkout pobiera commit
# z chwili WYZWOLENIA, a nie startu, wiec drugi przebieg klonowal stan sprzed
# pomiaru pierwszego i przegrywal rebase na tych samych liniach.
# Wniosek: jedynym zabezpieczeniem jest jedno zrodlo wyzwalania.
concurrency:
  group: aktualizacja-ruchu
  cancel-in-progress: false

jobs:
  pomiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz czasy przejazdu
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/fetch_traffic.py

      # Zdarzenia drogowe maja osobny, znacznie wezszy prog (2 500 zapytan
      # miesiecznie), wiec skrypt sam pilnuje minimalnego odstepu 28 minut
      # i przy czestszych przebiegach po prostu konczy sie komunikatem
      # "POMINIETO". Blad tego kroku nie moze przerwac pomiaru czasow -
      # to dodatek, a nie glowna funkcja strony.
      - name: Pobierz zdarzenia drogowe
        continue-on-error: true
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/fetch_incidents.py

      - name: Przelicz profil godzinowy
        run: python scripts/build_profile.py

      # Zabezpieczenie przed sytuacja, w ktorej uzytkownik dostaje nowy HTML ze
      # starym CSS lub JS z pamieci podrecznej przegladarki. Skrypt jest
      # idempotentny - gdy zasoby sie nie zmienily, nie rusza pliku.
      - name: Odswiez wersje zasobow w index.html
        run: python scripts/wersjonuj_zasoby.py

      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "dane: pomiar ruchu $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
