name: Aktualizacja danych o ruchu

on:
  schedule:
    # UWAGA: minuty celowo NIE sa rowne zeru ani wielokrotnosci 10.
    # Dokumentacja GitHuba (sekcja "schedule" w events-that-trigger-workflows):
    #   "The schedule event can be delayed during periods of high loads of
    #    GitHub Actions workflow runs. High load times include the start of
    #    every hour. If the load is sufficiently high enough, some queued jobs
    #    may be dropped. To decrease the chance of delay, schedule your
    #    workflow to run at a different time of the hour."
    # Pierwsza wersja uzywala "*/10" i "0", czyli trafiala dokladnie w szczyt
    # obciazenia platformy - przez pierwsze trzy godziny zycia repozytorium nie
    # wykonal sie ani jeden przebieg z harmonogramu.
    #
    # Darmowy prog TomTom dla Routing API to 20 000 zapytan MIESIECZNIE.
    # Kazdy przebieg zuzywa 8 zapytan (po jednym na trase), wiec harmonogram
    # jest zageszczony tylko w godzinach szczytu.
    #
    # Szczyt (co 10 min): 04:00-07:59 i 12:00-16:59 UTC.
    #   Zakres w UTC celowo szerszy niz polski szczyt, zeby objac zarowno
    #   czas letni (UTC+2), jak i zimowy (UTC+1).
    - cron: "4,14,24,34,44,54 4-7,12-16 * * *"
    # Poza szczytem (co godzine): 08:00-11:59 i 17:00-21:59 UTC.
    #   Bylo co 30 min przy 7 trasach; po dodaniu osmej trasy czestotliwosc
    #   zmniejszono, zeby utrzymac zuzycie na dotychczasowym poziomie.
    - cron: "27 8-11,17-21 * * *"
    #
    # Szczyt: 9 godzin x 6 = 54 przebiegi. Poza szczytem: 9 godzin x 1 = 9.
    # Razem 63 przebiegi/dobe x 8 tras = 504 zapytania/dobe = 15 624/31 dni.
    # Zapas do progu 20 000 wynosi ok. 22%.
    # Skrypt dodatkowo pilnuje budzetu i przerywa pomiary po 18 500 zapytaniach.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aktualizacja-ruchu
  cancel-in-progress: false

jobs:
  pomiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz czasy przejazdu
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/fetch_traffic.py

      - name: Przelicz profil godzinowy
        run: python scripts/build_profile.py

      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "dane: pomiar ruchu $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
