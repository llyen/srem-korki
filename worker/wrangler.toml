# Konfiguracja Workera, ktory wyzwala pomiary ruchu.
# Dokumentacja: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "srem-korki-cron"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Worker jest wystawiony pod adresem *.workers.dev z dwoch powodow. Po pierwsze
# bez tego wdrozenie konczy sie komunikatem "No targets deployed". Po drugie -
# i wazniejsze - to wlasnie ten adres jest kanalem, ktorym zewnetrzny zegar
# zamawia pomiar, odkad ustalono, ze harmonogram Cloudflare nie budzi Workera.
# Endpoint wyzwalajacy chroni sekret KLUCZ_WYZWALACZA (patrz README).
workers_dev = true

# Logi widoczne w panelu Cloudflare (Workers > srem-korki-cron > Logs).
# Bez tego nie da sie sprawdzic, czy wyzwolenie sie powiodlo.
[observability]
enabled = true

[triggers]
# Pusta tablica jest tu CELOWO i nie wolno jej wypelnic.
#
# Historia: crony Cloudflare nie uruchamialy Workera przez okolo 14 godzin od
# zapisania (test 1 wrzesnia 2026 z wyrazeniem "* * * * *" - piec kolejnych
# terminow bez jednego zapytania do API GitHuba, przy dzialajacej kontroli
# pozytywnej). Zegar przeniesiono wiec do cron-job.org. Nastepnego dnia crony
# Cloudflare ozyly i przez dwie godziny wyzwalaly pomiary rownolegle z nowym
# zegarem: kazdy termin dawal dwa przebiegi, drugi konczyl sie konfliktem
# przy zapisie danych, a zuzycie limitu TomTom podwoilo sie do 960 zapytan
# na dobe - czyli wyczerpanie puli okolo 19 dnia miesiaca.
#
# Zegar stoi teraz wylacznie w cron-job.org, patrz scripts/konfiguruj_zegar.py.
# Ma nad Cloudflare przewage merytoryczna: przyjmuje strefe czasowa, wiec
# harmonogram nie przesuwa sie przy zmianie czasu na zimowy.
#
# Zamierzone pory pomiarow (czas lokalny, caly rok):
#   06:00-09:59  co 10 minut     24 przebiegi
#   10:00-13:59  co 30 minut      8 przebiegow
#   14:00-17:59  co 10 minut     24 przebiegi
#   18:00-19:59  co 30 minut      4 przebiegi
#   20:00-05:59  brak pomiarow
# Razem 60 przebiegow na dobe x 8 tras = 480 zapytan (80% budzetu 18 500).
crons = []
